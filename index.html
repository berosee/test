<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>duckmp4-1</title>

  <style>
     .s{background-image:url("star.png");background-repeat: repeat-x;  width: 100%; height: 16px; margin-bottom: 10px;}
    html, body {
      font-family: 'Pretendard', Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px 0;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav a {
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      background: #f1f1f1;
      transition: 0.3s;
    }

    .nav a.active {
      background: #4a7cff;
      color: #fff;
    }

  /* 상단 현재 곡명 표시 (위치 및 여백 줄임) */
.now-playing {
  max-width: 720px;
  width: 95%;
  margin: 0 auto 8px; /* 아래 여백을 8px로 줄여 여백 최소화 */
  padding: 0;
  text-align: center;
  font-size: 16px; /* 폰트 크기를 약간 줄여 부담스럽지 않게 수정 */
  font-weight: bold;
  word-break: keep-all;
  color: #333333; /* 가독성을 위해 깔끔한 어두운 톤으로 변경 (필요시 백그라운드 색상에 맞춰 조정) */
  line-height: 1.2;
   /* 선명한 다크 아웃라인 적용 */
   color: white;
  text-shadow: 1px 1px 0px black, 0 0 20px blue, 0 0 5px darkblue;
}
/* 플레이어 영역 고정 (상단 카테고리 및 제목 레이아웃 간격 최적화) */
.player-box {
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  background: #ffffff;
  position: sticky;
  top: 55px; /* 상단 메뉴 높이에 맞춰 여백 조정 */
  z-index: 999;
  padding: 8px 0 12px; /* 위아래 패딩(여백) 축소 */
}

    .player-container {
      width: 95%;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      background: #000;
    }

    .player-ratio {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
    }

    #ytPlayerFrame, #html5Video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #html5Video {
      display: none;
      object-fit: contain;
    }

    table {
      max-width: 720px;
      width: 95%;
      margin: 10px auto 20px;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    td {
      position: relative;
      padding: 15px 15px 15px 45px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      line-height: 1.4;
      color: #333;
      font-size: 15px;
    }

    tr:hover td {
      background: #f9f9f9;
    }

    tr.active td {
      background: #f4f8ff;
      font-weight: bold;
      color: #4a7cff;
    }

    tr.active td::before {
      content: "▶";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #4a7cff;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 20px 0 50px;
    }

    .controls button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 30px;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .controls button:hover {
      background: #f1f1f1;
      border-color: #ccc;
    }
  </style>
</head>

<body>
<div class="s"></div> 

<div class="nav">
  <a href="?cat=old" id="nav-old">OLD</a>
  <a href="?cat=enka" id="nav-enka">ENKA</a>
  <a href="?cat=jazz" id="nav-jazz">JAZZ</a>
</div>

<div class="player-box">
  <div id="nowPlaying" class="now-playing"></div>

  <div class="player-container">
    <div class="player-ratio">
      <div id="ytPlayerDiv"><div id="ytPlayerFrame"></div></div>
      <video id="html5Video" controls playsinline></video>
    </div>
  </div>
</div>

<table id="playlist"></table>

<div class="controls">
  <button id="btnPrev">⏮ 이전</button>
  <button id="btnPlayPause">▶ 재생</button>
  <button id="btnNext">⏭ 다음</button>
</div>

<script>
const playlists = {
 old: [
   
    { title: " 1960년대 감성", artist: "정통 트로트",type: "youtube", url: "-ICJXKD72Xw", start: 12 },
    { title: " Green Green Grass of Home", type: "youtube", url: "uoo3P_xGYog", start: 3 }, /* 13초부터 시작 */
    { title: " the house of the rising sun", type: "youtube", url: "GZqX8kg4rSQ", start: 2 },
    { title: " Cotton Fields (1969)", type: "youtube", url: "AlSjx6F5Pl8", start: 2 },
    { title: " Country Boots Music", type: "youtube", url: "eQXVFUc4eDw", start: 2 },
    { title: " Red River Valley", type: "youtube", url: "70PwqEHGlb4", start: 2 },
    { title: " Tennessee Waltz ( 1959 )", type: "youtube", url: "5GWDgirgsq4", start: 2 },
    { title: " Sunset Country Classic", type: "youtube", url: "XFKcH4446Vw", start: 2 },
    { title: " Take Me Home Country Roads", type: "youtube", url: "iK0vsVRWsww", start: 12 }
  ],
  enka: [
    { title: " 린 X 아즈마 아키-사사메 유키(細雪)", type: "youtube", url: "vgPvhr7ZWbw" },
    { title: " 린 - 인생외길", type: "youtube", url: "rfjffhNxdLQ" },
    { title: " 都はるみ 裏町ごころ", type: "youtube", url: "vnHDs5DlAG0" },
    { title: " 雪中花 伍代夏子", type: "youtube", url: "B6WmSUodgRQ" },
    { title: " Enka Song 05", type: "youtube", url: "vgPvhr7ZWbw" },
    { title: " Enka Song 06", type: "youtube", url: "rfjffhNxdLQ" },
    { title: " Enka Song 07", type: "youtube", url: "vnHDs5DlAG0" },
    { title: " Enka Song 08", type: "youtube", url: "B6WmSUodgRQ" },
    { title: " Enka Song 09", type: "youtube", url: "vgPvhr7ZWbw" },
   { title: " 내가 만든 mp4 동영상 1", type: "mp4", url: "https://test-videos.co.uk/vids/bigbuckbunny/mp4/av1/360/Big_Buck_Bunny_360_10s_1MB.mp4", start: 2 },
    { title: " 전향진 남자라는 이유로", type: "mp4", url: "bae.mp4" },
    { title: " Enka Song 10", type: "youtube", url: "rfjffhNxdLQ" }
  ],
  jazz: [
    { title: " 번지없는 주막", type: "youtube", url: "Z9vzsUxvsEg" },
    { title: " 영시의 이별", type: "youtube", url: "29JJnC_L3OE" },
    { title: " 배호 모음집", type: "youtube", url: "dEc-U2hgd6A" },
    { title: " 꿈꾸는 백마강", type: "youtube", url: "50-PlZVG7aA" },
    { title: " 고향아줌마", type: "youtube", url: "6wvUMP1ZS7U" },
    { title: " Jazz Track 06", type: "youtube", url: "Z9vzsUxvsEg" },
    { title: " Jazz Track 07", type: "youtube", url: "29JJnC_L3OE" },
    { title: " Jazz Track 08", type: "youtube", url: "dEc-U2hgd6A" },
    { title: " Jazz Track 09", type: "youtube", url: "50-PlZVG7aA" },
    { title: " Jazz Track 10", type: "youtube", url: "6wvUMP1ZS7U" }
  ]
};

// 음표/아이콘 + [제목 - 아티스트] 텍스트 생성 함수
function getFormattedTitle(song) {
  const icon = song.type === "mp4" ? "🎬" : "🎵";
  const nameText = song.artist ? `${song.title} - ${song.artist}` : song.title;
  return `${icon} ${nameText}`;
}
function getCategory() {
  const params = new URLSearchParams(window.location.search);
  return params.get("cat") || "old";
}

const currentCategory = getCategory();
const currentListData = playlists[currentCategory] || playlists["old"];

const activeNav = document.getElementById("nav-" + currentCategory);
if (activeNav) activeNav.classList.add("active");

let currentIndex = 0;
const table = document.getElementById("playlist");
const html5Video = document.getElementById("html5Video");
const ytPlayerDiv = document.getElementById("ytPlayerDiv");
const nowPlayingDiv = document.getElementById("nowPlaying");
var player = null;
var isYtReady = false;

// 목록 생성
if (currentListData && currentListData.length > 0) {
  currentListData.forEach((song, index) => {
    const tr = document.createElement("tr");
   tr.innerHTML = `<td>${getFormattedTitle(song)}</td>`;
    tr.onclick = () => playByIndex(index, true);
    table.appendChild(tr);
  });
}

// 유튜브 API 로드 완료 시 실행
function onYouTubeIframeAPIReady() {
  player = new YT.Player("ytPlayerFrame", {
    videoId: "",
    playerVars: { rel: 0, playsinline: 1, autoplay: 0 },
    events: {
      onReady: function() {
        isYtReady = true;
        playByIndex(0, false);
      },
      onStateChange: onStateChange
    }
  });
}

function playByIndex(index, autoPlay = true) {
  currentIndex = index;
  const currentSong = currentListData[currentIndex];
  if (!currentSong) return;

  const startTime = currentSong.start || 0;

 if (nowPlayingDiv) {
  nowPlayingDiv.textContent = getFormattedTitle(currentSong);
}
  setActiveRow(currentIndex);

  // MP4 동영상 재생
  if (currentSong.type === "mp4") {
    if (isYtReady && player && typeof player.pauseVideo === "function") {
      player.pauseVideo();
    }
    ytPlayerDiv.style.display = "none";
    html5Video.style.display = "block";
    
    html5Video.src = currentSong.url;
    html5Video.onloadedmetadata = function() {
      html5Video.currentTime = startTime;
      if (autoPlay) {
        html5Video.play().catch(e => console.log(e));
      }
    };
  } 
  // 유튜브 영상 재생
  else {
    html5Video.pause();
    html5Video.style.display = "none";
    ytPlayerDiv.style.display = "block";

    if (!isYtReady || !player || typeof player.loadVideoById !== "function") {
      const iframe = document.getElementById("ytPlayerFrame");
      const autoPlayParam = autoPlay ? 1 : 0;
      iframe.src = `https://www.youtube.com/embed/${currentSong.url}?enablejsapi=1&autoplay=${autoPlayParam}&start=${startTime}`;
    } else {
      if (autoPlay) {
        player.loadVideoById({
          videoId: currentSong.url,
          startSeconds: startTime
        });
      } else {
        player.cueVideoById({
          videoId: currentSong.url,
          startSeconds: startTime
        });
      }
    }
  }
  updatePlayPauseButton();
}

function playPrev() {
  currentIndex = (currentIndex - 1 + currentListData.length) % currentListData.length;
  playByIndex(currentIndex, true);
}

function playNext() {
  currentIndex = (currentIndex + 1) % currentListData.length;
  playByIndex(currentIndex, true);
}

function togglePlayPause() {
  const currentSong = currentListData[currentIndex];
  if (!currentSong) return;

  if (currentSong.type === "mp4") {
    if (html5Video.paused) {
      html5Video.play();
    } else {
      html5Video.pause();
    }
  } else if (isYtReady && player && typeof player.getPlayerState === "function") {
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }
  updatePlayPauseButton();
}

html5Video.onended = function() { playNext(); };
html5Video.onplay = updatePlayPauseButton;
html5Video.onpause = updatePlayPauseButton;

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) {
    playNext();
  }
  updatePlayPauseButton();
}

function updatePlayPauseButton() {
  const btn = document.getElementById("btnPlayPause");
  const currentSong = currentListData[currentIndex];
  if (!currentSong) return;

  if (currentSong.type === "mp4") {
    btn.textContent = html5Video.paused ? "▶ 재생" : "⏸ 일시정지";
  } else if (isYtReady && player && typeof player.getPlayerState === "function") {
    const state = player.getPlayerState();
    btn.textContent = state === YT.PlayerState.PLAYING ? "⏸ 일시정지" : "▶ 재생"; // 오타 수정된 부분
  }
}

function setActiveRow(index) {
  const rows = document.querySelectorAll("#playlist tr");
  rows.forEach((tr, i) => {
    tr.classList.toggle("active", i === index);
  });
}

document.getElementById("btnPrev").addEventListener("click", playPrev);
document.getElementById("btnNext").addEventListener("click", playNext);
document.getElementById("btnPlayPause").addEventListener("click", togglePlayPause);
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
