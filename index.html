<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content='img.jpg' property='og:image'/>  
  <title>duckmp4</title>

  <style>
     .center{
      text-align: center;
    }
    .s{background-image:url("star.png");background-repeat: repeat-x;  width: 100%; height: 16px; margin-bottom: 10px;}
    /* 기본 스타일 */
    html, body {
      font-family: 'Pretendard', Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* 상단 메뉴 고정 */
    .nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px 0;
      background: #ffffff;
      border-bottom: 0px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav a {
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      background: #f1f1f1;
      transition: 0.3s;
    }

    .nav a.active {
      background: #4a7cff;
      color: #fff;
    }

    /* 재생 중인 곡명 표시 영역 (글자 그림자 효과 및 음표 또렷하게 수정) */
    .now-playing {
      max-width: 720px;
      width: 95%;
      margin: 10px auto 0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      word-break: keep-all;
      color: #ffffff;
      text-shadow: 
        -1px -1px 0 #1e293b,
         1px -1px 0 #1e293b,
        -1px  1px 0 #1e293b,
         1px  1px 0 #1e293b,
         0px  2px 4px rgba(0, 0, 0, 0.2);
    }

    /* 플레이어 영역 고정 */
    .player-box {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      position: sticky;
      top: 61px;
      z-index: 999;
      padding: 10px 0 15px;
    }

    .player-container {
      width: 95%;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      background: #000;
    }

    .player-ratio {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 비율 */
    }

    #player, #html5Video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #html5Video {
      display: none;
      object-fit: contain;
    }

    /* 플레이리스트 테이블 */
    table {
      max-width: 720px;
      width: 95%;
      margin: 10px auto 20px;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    td {
      position: relative;
      padding: 15px 15px 15px 45px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      line-height: 1.4;
      color: #333;
      font-size: 15px;
    }

    tr:hover td {
      background: #f9f9f9;
    }

    tr.active td {
      background: #f4f8ff;
      font-weight: bold;
      color: #4a7cff;
    }

    tr.active td::before {
      content: "▶";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #4a7cff;
    }

    /* 하단 컨트롤러 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 20px 0 50px;
    }

    .controls button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 30px;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .controls button:hover {
      background: #f1f1f1;
      border-color: #ccc;
    }
  </style>
</head>

<body>
<div class="s"></div> 
<div class="nav">
  <a href="?cat=old" id="nav-old">OLD</a>
  <a href="?cat=enka" id="nav-enka">ENKA</a>
  <a href="?cat=jazz" id="nav-jazz">JAZZ</a>
</div>

<div class="player-box">
  <!-- 상단 현재 곡명 표시 영역 -->
  

  <div class="player-container">
    <div class="player-ratio">
      <!-- 유튜브 플레이어 -->
      <div id="player"></div>
      <!-- MP4 동영상 전용 플레이어 -->
      <video id="html5Video" controls playsinline></video>
    </div>
  </div>
</div>

<table id="playlist"></table>

<div class="controls">
  <button id="btnPrev">⏮ 이전</button>
  <button id="btnPlayPause">▶ 재생</button>
  <button id="btnNext">⏭ 다음</button>
</div>

<script>
// 카테고리별 데이터 (모두 10곡으로 확대)
const playlists = {
  old: [
    { title: "🎵 Green Green Grass of Home", id: "uoo3P_xGYog" },
    { title: "🎵 the house of the rising sun", id: "GZqX8kg4rSQ" },
    { title: "🎵 Cotton Fields (1969)", id: "AlSjx6F5Pl8" },
    { title: "🎵 Country Boots Music", id: "eQXVFUc4eDw" },
    { title: "🎵 Red River Valley", id: "70PwqEHGlb4" },
    { title: "🎵 Tennessee Waltz ( 1959 )", id: "5GWDgirgsq4" },
    { title: "🎵 Sunset Country Classic", id: "XFKcH4446Vw" },
    { title: "🎵 Take Me Home Country Roads", id: "iK0vsVRWsww" },
    { title: "🎵 Do That To Me One More Time", id: "z_XfJyrNLRQ" },
    { title: "🎵 Best Country Heartland Songs", id: "8VO67jNHLpA" }
  ],
  enka: [
    /* 
       MP4 파일을 사용하는 경우 id 대신 mp4 속성에 파일 주소(URL)를 적어주시면 됩니다.
       예시: mp4: "https://raw.githubusercontent.com/사용자/저장소/main/video1.mp4"
    */
    { title: "🎵 린 X 아즈마 아키-사사메 유키(細雪)", id: "vgPvhr7ZWbw" },
    { title: "🎵 린 - 인생외길", id: "rfjffhNxdLQ" },
    { title: "🎵 都はるみ 裏町ごころ", id: "vnHDs5DlAG0" },
    { title: "🎵 린 X 아즈마 아키", id: "vgPvhr7ZWbw" },
    { title: "🎵 雪中花 伍代夏子", id: "B6WmSUodgRQ" },
    { title: "🎵 Enka Hit Track 06", id: "vgPvhr7ZWbw" },
    { title: "🎵 Enka Hit Track 07", id: "rfjffhNxdLQ" },
    { title: "🎵 Enka Hit Track 08", id: "vnHDs5DlAG0" },
    { title: "🎵 Enka Hit Track 09", id: "B6WmSUodgRQ" },
    { title: "🎵 Enka Hit Track 10", id: "vgPvhr7ZWbw" }
  ],
  jazz: [
    { title: "🎷 번지없는 주막", id: "Z9vzsUxvsEg" },
    { title: "🎷 영시의 이별", id: "29JJnC_L3OE" },
    { title: "🎷 배호 모음집", id: "dEc-U2hgd6A" },
    { title: "🎷 꿈꾸는 백마강", id: "50-PlZVG7aA" },
    { title: "🎷 고향아줌마", id: "6wvUMP1ZS7U" },
 { title: "🎵 내 직접 만든 영상", mp4: "https://test-videos.co.uk/vids/bigbuckbunny/mp4/av1/360/Big_Buck_Bunny_360_10s_1MB.mp4" },
{ title: "🎬 전향진 남자라는 이유로", mp4, url: "bae.mp4" },
    { title: "🎷 Jazz Collection 10", id: "6wvUMP1ZS7U" }
  ]
};

function getCategory() {
  const params = new URLSearchParams(window.location.search);
  return params.get("cat") || "old";
}

const currentCategory = getCategory();
const currentListData = playlists[currentCategory] || playlists["old"];

const activeNav = document.getElementById("nav-" + currentCategory);
if (activeNav) activeNav.classList.add("active");

let currentIndex = 0;
const table = document.getElementById("playlist");
const html5Video = document.getElementById("html5Video");
const ytPlayerDiv = document.getElementById("player");
const nowPlayingDiv = document.getElementById("nowPlaying");

// 테이블 리스트 생성
currentListData.forEach((song, index) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${song.title}</td>`;
  tr.onclick = () => playByIndex(index);
  table.appendChild(tr);
});

var player;
function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    videoId: currentListData[0].id || "",
    playerVars: { 
      rel: 0, 
      playsinline: 1,
      autoplay: 0 
    },
    events: { 
      onReady: onPlayerReady,
      onStateChange: onStateChange 
    }
  });
}

function onPlayerReady() {
  playByIndex(0, false); // 초기 로딩 (자동재생 안함)
}

function playByIndex(index, isUserAction = true) {
  currentIndex = index;
  const currentSong = currentListData[currentIndex];

  // 상단 곡명 업데이트
  if (nowPlayingDiv) {
    nowPlayingDiv.textContent = currentSong.title;
  }

  setActiveRow(currentIndex);

  // MP4 동영상인 경우
  if (currentSong.mp4) {
    if (player && typeof player.pauseVideo === "function") {
      player.pauseVideo();
    }
    ytPlayerDiv.style.display = "none";
    html5Video.style.display = "block";
    
    html5Video.src = currentSong.mp4;
    if (isUserAction) {
      html5Video.play();
    }
  } 
  // 유튜브 동영상인 경우
  else {
    html5Video.pause();
    html5Video.style.display = "none";
    ytPlayerDiv.style.display = "block";

    if (player && typeof player.loadVideoById === "function") {
      if (isUserAction) {
        player.loadVideoById(currentSong.id);
      } else {
        player.cueVideoById(currentSong.id);
      }
    }
  }
  updatePlayPauseButton();
}

function playPrev() {
  currentIndex = (currentIndex - 1 + currentListData.length) % currentListData.length;
  playByIndex(currentIndex);
}

function playNext() {
  currentIndex = (currentIndex + 1) % currentListData.length;
  playByIndex(currentIndex);
}

function togglePlayPause() {
  const currentSong = currentListData[currentIndex];
  
  if (currentSong.mp4) {
    if (html5Video.paused) {
      html5Video.play();
    } else {
      html5Video.pause();
    }
  } else if (player) {
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }
  updatePlayPauseButton();
}

// MP4 재생 종료 시 다음 곡 자동 재생
html5Video.onended = function() {
  playNext();
};

// MP4 재생 상태 변경 시 버튼 텍스트 업데이트
html5Video.onplay = updatePlayPauseButton;
html5Video.onpause = updatePlayPauseButton;

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) {
    playNext();
  }
  updatePlayPauseButton();
}

function updatePlayPauseButton() {
  const btn = document.getElementById("btnPlayPause");
  const currentSong = currentListData[currentIndex];

  if (currentSong.mp4) {
    btn.textContent = html5Video.paused ? "▶ 재생" : "⏸ 일시정지";
  } else if (player && typeof player.getPlayerState === "function") {
    const state = player.getPlayerState();
    btn.textContent = state === YT.PlayerState.PLAYING ? "⏸ 일시정지" : "▶ 재생";
  }
}

function setActiveRow(index) {
  const rows = document.querySelectorAll("#playlist tr");
  rows.forEach((tr, i) => {
    tr.classList.toggle("active", i === index);
  });
}

document.getElementById("btnPrev").addEventListener("click", playPrev);
document.getElementById("btnNext").addEventListener("click", playNext);
document.getElementById("btnPlayPause").addEventListener("click", togglePlayPause);
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
